apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "reminder-api.name" . }}
  labels: {{- include "reminder-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "reminder-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "reminder-api.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          # The app needs ~8s to boot. startupProbe absorbs that, so liveness
          # can stay aggressive afterwards without killing a slow start.
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
          resources: {{- toYaml .Values.resources | nindent 12 }}
