apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reminder-api-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Wasseel/calendar-reminder.git
    targetRevision: main
    path: deploy/chart
    helm:
      valueFiles:
        - envs/dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
